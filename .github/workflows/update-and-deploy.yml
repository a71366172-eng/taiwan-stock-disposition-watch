name: Update market data and deploy

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Taiwan (UTC+8): every four hours
    # at 00:00, 04:00, 08:00, 12:00, 16:00, and 20:00.
    - cron: '0 */4 * * *'
    # Taiwan 14:30 through 19:30, once per hour (UTC 06:30–11:30).
    - cron: '30 6-11 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect official TWSE and TPEx data
        if: github.event_name != 'push' # Code-only releases reuse the latest verified snapshot; scheduled/manual runs refresh official data.
        env:
          HISTORY_BATCH_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && 'next' || '' }}
        run: python jobs/collect_market.py
      - name: Collect official stock-futures initial margins
        if: github.event_name != 'push'
        run: python jobs/collect_futures_margins.py
      - name: Verify snapshot and rules
        run: |
          npm run data:verify
          node --experimental-strip-types --test tests/rules.test.ts tests/public-source.test.ts tests/disposition-metrics.test.ts tests/stock-comparison.test.ts tests/comparison-symbols.test.ts tests/position-ratio.test.ts
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish immutable snapshot to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase credentials are not configured; using the published static snapshot."
            exit 0
          fi
          python scripts/publish_supabase.py data/market.json
      - name: Commit updated public snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/market.json public/data/market.json data/verification.json data/futures-margins.json public/data/futures-margins.json
          if [ -f data/screener.json ] && [ -f public/data/screener.json ]; then
            git add data/screener.json public/data/screener.json
          fi
          git diff --cached --quiet || git commit -m "data: update official market snapshot"
          git push
      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Update market data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * 1-5'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect official TWSE and TPEx data
        run: python jobs/collect_market.py
      - name: Verify snapshot and rules
        run: |
          npm run data:verify
          node --experimental-strip-types --test tests/rules.test.ts
      - name: Publish immutable snapshot to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase credentials are not configured; using the published static snapshot."
            exit 0
          fi
          python scripts/publish_supabase.py data/market.json
      - name: Commit updated public snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/market.json public/data/market.json data/verification.json
          git diff --cached --quiet || git commit -m "data: update official market snapshot"
          git push
      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
